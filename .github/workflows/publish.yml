name: Publish NuGet

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  publish:
    name: Build, Pack & Publish NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract versions from csproj
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/UruFactura/UruFactura.csproj)
          for csproj in src/UruFactura.Pdf/UruFactura.Pdf.csproj src/UruFactura.EntityFrameworkCore/UruFactura.EntityFrameworkCore.csproj; do
            OTHER=$(grep -oP '(?<=<Version>)[^<]+' "$csproj")
            if [ "$OTHER" != "$VERSION" ]; then
              echo "::error::$csproj tiene la versión $OTHER y UruFactura.csproj $VERSION"
              exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión v$VERSION de los csproj"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore UruFactura.slnx

      - name: Build
        run: dotnet build UruFactura.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test UruFactura.slnx --no-build --configuration Release --verbosity normal

      - name: Pack UruFactura
        run: >
          dotnet pack src/UruFactura/UruFactura.csproj
          --no-build
          --configuration Release
          --output ./nupkg

      - name: Pack UruFactura.Pdf
        run: >
          dotnet pack src/UruFactura.Pdf/UruFactura.Pdf.csproj
          --no-build
          --configuration Release
          --output ./nupkg

      - name: Pack UruFactura.EntityFrameworkCore
        run: >
          dotnet pack src/UruFactura.EntityFrameworkCore/UruFactura.EntityFrameworkCore.csproj
          --no-build
          --configuration Release
          --output ./nupkg

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.VERSION }}
          path: ./nupkg/*.nupkg
          retention-days: 30

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
