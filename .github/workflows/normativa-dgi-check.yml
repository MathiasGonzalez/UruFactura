name: Normativa DGI — Recordatorio mensual

on:
  schedule:
    # Primer día de cada mes a las 12:00 UTC (09:00 en Montevideo)
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar el issue que se crearía (sin crearlo)'
        required: false
        default: false
        type: boolean

concurrency:
  group: normativa-dgi-check
  cancel-in-progress: false

jobs:
  crear-issue-recordatorio:
    name: Crear issue de revisión normativa DGI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Obtener versión CFE implementada
        id: version
        run: |
          # Primer WriteAttributeString("version", "X.Y") del XML builder.
          VERSION=$(grep -m1 -oP 'WriteAttributeString\("version",\s*"\K[^"]+' \
            src/UruFactura/Xml/CfeXmlBuilder.cs || true)
          echo "cfe_version=${VERSION:-desconocida}" >> "$GITHUB_OUTPUT"

      - name: Crear issue de recordatorio
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CFE_VERSION: ${{ steps.version.outputs.cfe_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const version = process.env.CFE_VERSION;
            const dryRun = process.env.DRY_RUN === 'true';
            const { owner, repo } = context.repo;
            const ahora = new Date();
            const hoy = ahora.toISOString().slice(0, 10);
            const anio = ahora.getFullYear();
            const mes = ahora.toLocaleString('es', { month: 'long', year: 'numeric', timeZone: 'America/Montevideo' });
            const runbook = `https://github.com/${owner}/${repo}/blob/main/docs/NORMATIVA_DGI_UPDATE.md`;
            const label = 'normativa-dgi';
            const title = `📋 Revisión normativa DGI — ${mes}`;

            const body = `## Revisión mensual de normativa DGI

            Este issue es generado automáticamente el primer día de cada mes para recordar revisar si la DGI publicó cambios en el formato CFE u otras normativas que requieran actualizar el SDK.

            **Versión CFE implementada actualmente:** \`${version}\`
            **Fecha de generación:** ${hoy}

            ---

            ## Instrucciones para el agente o desarrollador

            Ejecutar el runbook [docs/NORMATIVA_DGI_UPDATE.md](${runbook}) siguiendo estos pasos:

            ### 1. Buscar cambios recientes en la DGI

            Buscar en la web con las siguientes consultas:
            - \`DGI Uruguay CFE formato versión ${anio} cambios\`
            - \`DGI Uruguay factura electrónica nueva normativa ${anio}\`
            - Revisar: https://www.dgi.gub.uy/wdgi/page?2,factura-electronica,index,O,es,0,

            ### 2. Evaluar si hay cambios

            - [ ] ¿Nueva versión del formato CFE? (actual: \`${version}\`)
            - [ ] ¿Nuevos campos obligatorios en Zona A/B/C/D/E/F/G?
            - [ ] ¿Nuevos tipos de CFE?
            - [ ] ¿Cambio en endpoints SOAP?
            - [ ] ¿Cambio en tasas de IVA?

            ### 3. Actuar según resultado

            - **Sin cambios:** Cerrar este issue con el comentario "Sin cambios detectados — normativa vigente al día."
            - **Con cambios:** Implementar según el runbook, abrir PR, y cerrar este issue con referencia al PR.

            ---

            > 💡 Para más detalles sobre qué revisar y cómo implementar los cambios, ver [docs/NORMATIVA_DGI_UPDATE.md](${runbook}).
            `.replace(/^ {12}/gm, '');

            if (dryRun) {
              core.info('=== DRY RUN: issue que se crearía ===');
              core.info(`Título: ${title}`);
              core.info(body);
              return;
            }

            // Evitar acumular recordatorios: si hay uno abierto, comentar en él.
            const { data: abiertos } = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 1,
            });
            if (abiertos.length > 0) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: abiertos[0].number,
                body: `⏰ Sigue pendiente la revisión de ${mes}. Versión CFE implementada: \`${version}\`.`,
              });
              core.info(`Ya existe el issue abierto #${abiertos[0].number}; se agregó un comentario.`);
              return;
            }

            await github.rest.issues.create({
              owner, repo, title, body,
              labels: [label, 'maintenance'],
            });
