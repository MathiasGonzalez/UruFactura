version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories: ["/src/*", "/tests/*"]
    schedule:
      interval: monthly
    # FluentReport 3.1.0 exige SkiaSharp >= 4.154, así que ya no se congela en 3.x.
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: monthly
    groups:
      landing:
        patterns: ["*"]
